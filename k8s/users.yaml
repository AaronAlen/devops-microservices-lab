apiVersion: apps/v1
kind: Deployment
metadata:
  name: users
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels: {app: users}
  template:
    metadata:
      labels: {app: users}
    spec:
      containers:
      - name: users
        image: red2071722/micro-users:latest
        imagePullPolicy: Always
        ports: [{containerPort: 3001}]
        resources:
          requests: {cpu: "100m", memory: "128Mi"}
          limits: {cpu: "500m", memory: "256Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: users
  namespace: microservices
spec:
  selector: {app: users}
  ports: [{port: 3001, targetPort: 3001}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: users
  namespace: microservices
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: users
  minReplicas: 1
  maxReplicas: 5
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
